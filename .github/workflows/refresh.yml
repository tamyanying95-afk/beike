name: Refresh Beike Data

on:
  schedule:
    # 每周三 09:00 (Asia/Shanghai) == 每周三 01:00 UTC
    - cron: "0 1 * * 3"
  workflow_dispatch:      # 允许在 Actions 页面手动点一次

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Scrape today's listing counts
        env:
          # 可选：如果以后 GitHub 的 IP 被挡，在仓库 Settings → Secrets 里
          # 加 HTTP_PROXY / HTTPS_PROXY 即可自动走代理，不改代码。
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
        run: python scrape_ke_counts.py

      - name: Build HTML / Excel report
        run: python build_report.py

      - name: Sanity check (不要拿空数据覆盖旧数据)
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          MIN_OK = 30        # 52 城里有 7 个本来就没数据，正常应抓到 40+
          new = json.loads(Path("output/ke_counts.json").read_text(encoding="utf-8"))
          new_ok = new.get("success", 0)
          print("本次成功城市:", new_ok)

          prev = Path("data/latest.json")
          old_ok = 0
          if prev.exists():
              try:
                  old_ok = json.loads(prev.read_text(encoding="utf-8")).get("success", 0)
              except Exception:
                  old_ok = 0
              print("上次成功城市:", old_ok)

          # 双重门槛：绝对下限 + 相对上次不能明显退步
          if new_ok < MIN_OK:
              sys.exit(f"只抓到 {new_ok} 城（下限 {MIN_OK}），疑似被反爬拦截，保留旧数据不发布。")
          if old_ok and new_ok < old_ok * 0.9:
              sys.exit(f"只抓到 {new_ok} 城（上次 {old_ok} 城），数据退步过多，保留旧数据不发布。")
          PY

      - name: Publish to GitHub Pages (/docs)
        run: |
          set -e
          mkdir -p docs data history
          TODAY=$(TZ=Asia/Shanghai date +%F)

          # 报告首页 + Excel（只保留最新一份 Excel）
          cp output/贝壳二手挂牌套数_*.html docs/index.html
          rm -f docs/贝壳二手挂牌套数_*.xlsx
          cp output/贝壳二手挂牌套数_*.xlsx "docs/贝壳二手挂牌套数_${TODAY}.xlsx"

          # 原始数据快照 + 历史档案（方便以后画趋势）
          cp output/ke_counts.json data/latest.json
          cp output/ke_counts.json "history/${TODAY}.json"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data history
          if git diff --cached --quiet; then
            echo "数据没有变化，跳过提交。"
            exit 0
          fi
          git commit -m "chore: refresh data ${TODAY}"
          git push
